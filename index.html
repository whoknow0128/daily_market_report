<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=./integtated_analysis/html/index.html">
<title>臺股盤後分析戰情室</title>
<style>

:root, :root[data-theme="dark"] {
  --bg: #0b0f17;
  --surface: #121824;
  --surface-2: #182132;
  --border: #25324a;
  --text: #e6edf7;
  --muted: #8fa1bf;
  --accent: #38bdf8;
  --up: #ef4444;
  --up-bg: rgba(239, 68, 68, 0.14);
  --up-border: rgba(239, 68, 68, 0.40);
  --down: #22c55e;
  --down-bg: rgba(34, 197, 94, 0.14);
  --down-border: rgba(34, 197, 94, 0.40);
  --warn: #f59e0b;
  --warn-bg: rgba(245, 158, 11, 0.14);
  --warn-border: rgba(245, 158, 11, 0.40);
  --info: #38bdf8;
  --info-bg: rgba(56, 189, 248, 0.14);
  --info-border: rgba(56, 189, 248, 0.40);
  --neutral-bg: rgba(148, 163, 184, 0.12);
  --neutral-border: rgba(148, 163, 184, 0.30);
  --grid-line: rgba(148, 163, 184, 0.12);
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
}
:root[data-theme="light"] {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #dce3ee;
  --text: #0f172a;
  --muted: #64748b;
  --accent: #0284c7;
  --up: #dc2626;
  --up-bg: rgba(220, 38, 38, 0.10);
  --up-border: rgba(220, 38, 38, 0.35);
  --down: #16a34a;
  --down-bg: rgba(22, 163, 74, 0.10);
  --down-border: rgba(22, 163, 74, 0.35);
  --warn: #d97706;
  --warn-bg: rgba(217, 119, 6, 0.10);
  --warn-border: rgba(217, 119, 6, 0.35);
  --info: #0284c7;
  --info-bg: rgba(2, 132, 199, 0.10);
  --info-border: rgba(2, 132, 199, 0.35);
  --neutral-bg: rgba(100, 116, 139, 0.10);
  --neutral-border: rgba(100, 116, 139, 0.25);
  --grid-line: rgba(100, 116, 139, 0.16);
  --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 18px 20px 36px;
}
.container { max-width: 1520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-variant-numeric: tabular-nums; }
.text-up { color: var(--up); }
.text-down { color: var(--down); }
.text-warn { color: var(--warn); }
.text-info { color: var(--info); }
.muted { color: var(--muted); }
.pill, .mini-pill {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 999px; font-weight: 600; white-space: nowrap;
}
.pill { padding: 3px 10px; font-size: 0.78rem; }
.mini-pill { padding: 2px 7px; font-size: 0.71rem; }
.badge-up { background: var(--up-bg); color: var(--up); border: 1px solid var(--up-border); }
.badge-down { background: var(--down-bg); color: var(--down); border: 1px solid var(--down-border); }
.badge-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
.badge-info { background: var(--info-bg); color: var(--info); border: 1px solid var(--info-border); }
.badge-neutral { background: var(--neutral-bg); color: var(--muted); border: 1px solid var(--neutral-border); }
.dash-header {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 15px 18px; box-shadow: var(--shadow);
}
.header-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.header-title-group { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.header-title-group h1 { font-size: 1.24rem; font-weight: 700; letter-spacing: 0.01em; }
.header-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.nav-link-btn, .theme-btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 11px; font-size: 0.79rem; font-weight: 600;
  text-decoration: none; cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.nav-link-btn:hover, .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-link-primary { border-color: var(--info-border); background: var(--info-bg); color: var(--info); }
.header-sub { margin-top: 7px; font-size: 0.81rem; color: var(--muted); }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 15px 17px; box-shadow: var(--shadow);
}
.card-title-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.card-title { font-size: 0.99rem; font-weight: 700; }
.disclaimer-footer {
  margin-top: 4px;
  background: var(--surface-2);
  border-left: 4px solid var(--warn);
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.65;
}
.disclaimer-title {
  font-size: 0.86rem;
  font-weight: 700;
  color: var(--warn);
  margin-bottom: 6px;
}
.disclaimer-footer p { margin-bottom: 4px; }
.disclaimer-footer p:last-child { margin-bottom: 0; }
.disclaimer-footer strong { color: var(--text); font-weight: 600; }

.portal { max-width: 540px; margin: 12vh auto; text-align: center; }
</style>
<script>window.location.replace("./integtated_analysis/html/index.html");</script>
</head>

</div>
</body>
</html>
